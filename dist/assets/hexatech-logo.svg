<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 145" fill="none">
  <defs>
    <!-- Vibrant Electric Blue Gradient for Right Half -->
    <linearGradient id="hexaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path Left Half (x <= 120) -->
    <clipPath id="clipLeft">
      <rect x="0" y="0" width="120" height="145" />
    </clipPath>

    <!-- Clip Path Right Half (x >= 120) -->
    <clipPath id="clipRight">
      <rect x="120" y="0" width="120" height="145" />
    </clipPath>
  </defs>

  <!-- 1. HEXAGON FRAME (OUTER R=50, INNER r=32) -->
  <!-- Outer Hexagon: (120,8) -> (162,32) -> (162,80) -> (120,104) -> (78,80) -> (78,32) -->
  <!-- Inner Hexagon: (120,26) -> (148,42) -> (148,70) -> (120,86) -> (92,70) -> (92,42) -->
  <g id="emblem">
    <!-- LEFT HALF (Crisp White / Ivory #F2F3EC) -->
    <g clip-path="url(#clipLeft)">
      <!-- Outer Hexagon minus Inner Hexagon ring -->
      <path 
        d="M 120 8 L 162 32 L 162 80 L 120 104 L 78 80 L 78 32 Z M 120 26 L 92 42 L 92 70 L 120 86 L 148 70 L 148 42 Z" 
        fill="#F2F3EC" 
        fill-rule="evenodd"
      />
      <!-- H Letter Left -->
      <path 
        d="M 104 40 L 115 40 L 115 51 L 120 51 L 120 61 L 115 61 L 115 72 L 104 72 Z" 
        fill="#F2F3EC"
      />
    </g>

    <!-- RIGHT HALF (Electric Blue Gradient) -->
    <g clip-path="url(#clipRight)">
      <!-- Outer Hexagon minus Inner Hexagon ring -->
      <path 
        d="M 120 8 L 162 32 L 162 80 L 120 104 L 78 80 L 78 32 Z M 120 26 L 92 42 L 92 70 L 120 86 L 148 70 L 148 42 Z" 
        fill="url(#hexaBlue)" 
        fill-rule="evenodd"
        filter="url(#subtleGlow)"
      />
      <!-- H Letter Right -->
      <path 
        d="M 120 51 L 125 51 L 125 40 L 136 40 L 136 72 L 125 72 L 125 61 L 120 61 Z" 
        fill="url(#hexaBlue)"
        filter="url(#subtleGlow)"
      />
    </g>

    <!-- Micro Vertical Seam Divider for High-Tech Precision -->
    <line x1="120" y1="8" x2="120" y2="26" stroke="#071A16" stroke-width="1" />
    <line x1="120" y1="86" x2="120" y2="104" stroke="#071A16" stroke-width="1" />
  </g>

  <!-- 2. TYPOGRAPHY "HEXΛTECH" -->
  <g id="typography" transform="translate(12, 116)">
    <!-- H -->
    <path d="M 18 20 L 18 5 L 22.5 5 L 22.5 10.5 L 30 10.5 L 30 5 L 34.5 5 L 34.5 20 L 30 20 L 30 14.5 L 22.5 14.5 L 22.5 20 Z" fill="#F2F3EC" />
    
    <!-- E -->
    <path d="M 41 20 L 41 5 L 56 5 L 56 9 L 45.5 9 L 45.5 10.5 L 54 10.5 L 54 14.5 L 45.5 14.5 L 45.5 16 L 56 16 L 56 20 Z" fill="#F2F3EC" />
    
    <!-- X -->
    <path d="M 62 20 L 67.5 12.5 L 62 5 L 67.5 5 L 71 10 L 74.5 5 L 80 5 L 74.5 12.5 L 80 20 L 74.5 20 L 71 15 L 67.5 20 Z" fill="#F2F3EC" />
    
    <!-- Λ (Inverted V with Tech Angle) -->
    <path d="M 85 20 L 93 5 L 97.5 5 L 105.5 20 L 100.5 20 L 95.2 10 L 90 20 Z" fill="#F2F3EC" />
    
    <!-- T -->
    <path d="M 112 5 L 129 5 L 129 9 L 122.5 9 L 122.5 20 L 118 20 L 118 9 L 112 9 Z" fill="url(#hexaBlue)" />
    
    <!-- E -->
    <path d="M 134 20 L 134 5 L 149 5 L 149 9 L 138.5 9 L 138.5 10.5 L 147 10.5 L 147 14.5 L 138.5 14.5 L 138.5 16 L 149 16 L 149 20 Z" fill="url(#hexaBlue)" />
    
    <!-- C -->
    <path d="M 166 9 L 166 5 L 154 5 L 154 20 L 166 20 L 166 16 L 158.5 16 L 158.5 9 Z" fill="url(#hexaBlue)" />
    
    <!-- H -->
    <path d="M 172 20 L 172 5 L 176.5 5 L 176.5 10.5 L 184 10.5 L 184 5 L 188.5 5 L 188.5 20 L 184 20 L 184 14.5 L 176.5 14.5 L 176.5 20 Z" fill="url(#hexaBlue)" />
  </g>
</svg>
