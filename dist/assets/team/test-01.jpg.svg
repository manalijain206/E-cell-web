<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" fill="none">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C24" />
      <stop offset="100%" stop-color="#0A0A0E" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#22222E" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="500" height="500" fill="url(#grad)" />
  <rect width="500" height="500" fill="url(#grid)" opacity="0.6" />
  
  <!-- Corner Tech Crosshairs -->
  <path d="M20 30 V20 H30 M480 30 V20 H470 M20 470 V480 H30 M480 470 V480 H470" stroke="#FF5722" stroke-width="1.5" />
  
  <!-- Center Emblem -->
  <circle cx="250" cy="225" r="38" fill="#14141A" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="250" cy="225" r="18" fill="#FF5722" fill-opacity="0.15" />
  <path d="M242 225 L258 225 M250 217 L250 233" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Badges and Text -->
  <rect x="190" y="280" width="120" height="20" rx="10" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="0.8"/>
  <text x="250" y="294" fill="#FF8A00" font-family="system-ui, monospace" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">TESTIMONIAL</text>
  
  <text x="250" y="325" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">STUDENT FOUNDER</text>
  <text x="250" y="346" fill="#71717A" font-family="system-ui, monospace" font-size="10.5" text-anchor="middle">Drop test-01.jpg here</text>
</svg>